allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - postcss@8.5.23
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11 || 4.1.12'
  - source-map-js@1.2.2
  - sharp@0.35.5
  - vite@8.1.6
  - zod@4.6.6
  - undici@7.30.1
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
overrides:
  postcss: ">=8.5.18"
  esbuild: ">=0.24.3"
  # 推移的依存の脆弱性対応（pnpm audit high 以上）。
  # これらは新しいメジャーが公開済みで、">=" だと利用側（eslint / postcss / jsdom）が
  # 想定しないメジャーまで引き上げられるため、"^" でメジャーを固定した上で修正版に上げる。
  sharp: ">=0.35.4"
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@5": "^5.0.9"
  "js-yaml@4": "^4.3.2"
  "nanoid@3": "^3.3.18"
  "undici@7": "^7.29.0"
  # vite 8.1.5 以下の high（GHSA-587h-7wmj-h5pm）対応。lockfile 更新だけでは 8.1.5 に留まるため。
  "vite@8": "^8.1.6"
