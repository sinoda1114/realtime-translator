allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
overrides:
  postcss: ">=8.5.18"
  esbuild: ">=0.24.3"
  # 推移的依存の脆弱性対応（pnpm audit high 以上）。
  # これらは新しいメジャーが公開済みで、">=" だと利用側（eslint / postcss / jsdom）が
  # 想定しないメジャーまで引き上げられるため、"^" でメジャーを固定した上で修正版に上げる。
  sharp: ">=0.35.4"
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@5": "^5.0.9"
  "js-yaml@4": "^4.3.2"
  "nanoid@3": "^3.3.18"
  "undici@7": "^7.29.0"
